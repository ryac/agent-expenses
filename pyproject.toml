[project]
name = "agent-expenses"
version = "0.1.0"
description = "Natural-language analytics agent over personal expense data: guardrailed text-to-SQL with an automated evaluation harness."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.5",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "openai-agents>=0.22.3",
    "python-dotenv>=1.2.3",
    "sqlglot>=30.21.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
